name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # Xcode 26.2 is pinned because later actool releases are reported to crash on .icon files.
      - run: sudo xcode-select -s /Applications/Xcode_26.2.app || echo "Xcode 26.2 missing, using default"
      - run: BURN_VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - run: tar -czf Burn.tar.gz -C build Burn.app
      - run: gh release create "$GITHUB_REF_NAME" Burn.tar.gz --title "Burn $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
